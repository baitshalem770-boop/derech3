<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כניסה ידנית</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}
  header{position:sticky;top:0;background:#1f3864;color:#fff;padding:12px 16px;z-index:2}
  h1{font-size:18px;margin:0 0 8px}
  .stats{display:flex;gap:16px;font-size:15px;margin-bottom:8px}
  .stats b{font-size:18px}
  input[type=search]{width:100%;box-sizing:border-box;font-size:18px;padding:10px;border:0;border-radius:6px}
  ul{list-style:none;margin:0;padding:8px}
  li{background:#fff;border-radius:8px;margin-bottom:8px;padding:12px;display:flex;align-items:center;gap:12px;border:2px solid transparent}
  li.in{background:#c6efce;border-color:#6aa84f}
  li.warn .note{color:#b45f06}
  li label{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer}
  input[type=checkbox]{width:28px;height:28px;flex:none}
  .name{font-size:18px;font-weight:bold}
  .meta{font-size:14px;color:#555}
  .time{font-size:13px;color:#2b6b2b}
  .hidden{display:none}
  button{margin:8px;padding:8px 12px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>משקיעים בבית – כניסה ידנית (בלי QR)</h1>
  <div class="stats">
    <span>סה״כ: <b id="total">0</b></span>
    <span>נכנסו: <b id="done">0</b></span>
    <span>נותרו: <b id="left">0</b></span>
  </div>
  <input type="search" id="q" placeholder="חיפוש לפי שם או נייד">
</header>
<ul id="list"></ul>
<button id="reset">איפוס כל הסימונים</button>
<script>
const people=[
["מענדי קיז׳נר","051-2769770","זוג בלי QR – עם מושקי",0],
["מושקי קיז׳נר","051-5296770","זוג בלי QR – עם מענדי",0],
["מנחם פלג","052-7707303","זוג בלי QR – עם רבקה",0],
["רבקה פלג","054-4859817","זוג בלי QR – עם מנחם",0],
["מנחם חוטר","053-6074770","זוג בלי QR – עם מושקא",0],
["מושקא חוטר","058-5559625","זוג בלי QR – עם מנחם",0],
["אברהם אודרמן","054-8181770","זוג בלי QR – עם רות",0],
["רות אודרמן","058-7700150","זוג בלי QR – עם אברהם",0],
["שלום כהן","954-3577574","הנייד שגוי. אשתו חני קיבלה QR",1],
["יעקב זרחיה","050-637112","חסרה ספרה בנייד. אשתו חני קיבלה QR",1],
["שלומית שחר","058-7701118","מגיעה לבד",0],
["רבקה מחפוץ","054-2217447","מגיעה לבד",0],
["רחלי אוחיון","052-6466131","מגיעה לבד",0],
["ענת מוגרבי","052-5909854","מגיעה לבד",0],
["דבורה פרידמן","054-6447076","מגיעה לבד",0],
["שרה שרעבי","052-7080546","מגיעה לבד",0],
["מרים סטריים","054-7704195","מגיעה לבד",0],
["שושי פרידמן","050-3020770","מגיעה לבד",0],
["מלכה גורביץ","054-7949938","מגיעה לבד",0],
["נעמה עטיה","052-701210","חסרה ספרה בנייד. בעלה רונן קיבל QR",1],
["דבורה לאה משה","052-70469944","ספרה מיותרת בנייד. בעלה יצחק אורי קיבל QR",1]
].sort((a,b)=>a[0].localeCompare(b[0],"he"));

const KEY="entry-2026-10-26";
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

const list=document.getElementById("list");
function render(){
  list.innerHTML="";
  people.forEach((p,i)=>{
    const li=document.createElement("li");
    li.dataset.s=(p[0]+" "+p[1]).replace(/-/g,"");
    li.dataset.s2=p[0]+" "+p[1];
    const t=state[i];
    li.className=(t?"in ":"")+(p[3]?"warn":"");
    li.innerHTML=`<label><input type="checkbox" ${t?"checked":""}>
      <span><div class="name">${p[0]}</div>
      <div class="meta">${p[1]}</div>
      <div class="meta note">${p[2]}</div>
      <div class="time">${t?"נכנס/ה ב-"+t:""}</div></span></label>`;
    li.querySelector("input").addEventListener("change",e=>{
      if(e.target.checked){state[i]=new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})}
      else{delete state[i]}
      save();render();filter();
    });
    list.appendChild(li);
  });
  const d=Object.keys(state).length;
  document.getElementById("total").textContent=people.length;
  document.getElementById("done").textContent=d;
  document.getElementById("left").textContent=people.length-d;
}
const q=document.getElementById("q");
function filter(){
  const v=q.value.trim(),v2=v.replace(/-/g,"");
  list.querySelectorAll("li").forEach(li=>{
    li.classList.toggle("hidden",v&&!(li.dataset.s2.includes(v)||li.dataset.s.includes(v2)));
  });
}
q.addEventListener("input",filter);
document.getElementById("reset").onclick=()=>{
  if(confirm("לאפס את כל הסימונים?")){state={};save();render();filter();}
};
render();
</script>
</body>
</html>
